<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" font-family="system-ui, sans-serif" font-size="13" role="img" aria-labelledby="w6-title">
<title id="w6-title">Desk 6DOF wiring: PC USB to pyboard v1.1, I2C to a PCA9685, six servos on channels 0 to 5, servo power from a separate 5-6 V supply, and a 2.42 inch SSD1309 OLED on the pyboard's SPI2</title>
<style>
  .w6-bg { fill: #ffffff; }
  .w6-box { fill: #f4f3ef; stroke: #55554f; stroke-width: 1.2; }
  .w6-plan { fill: #f4f3ef; stroke: #55554f; stroke-width: 1.2; stroke-dasharray: 6 4; }
  .w6-t { fill: #0b0b0b; }
  .w6-m { fill: #6b6a64; font-size: 11.5px; }
  .w6-h { fill: #0b0b0b; font-weight: 600; font-size: 14px; }
  .w6-pin { fill: #ffffff; stroke: #55554f; }
  .w6-w { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .w6-gnd { stroke: #3d3d3a; } .w6-3v3 { stroke: #2a78d6; } .w6-sda { stroke: #1baf7a; } .w6-scl { stroke: #eda100; }
  .w6-oe { stroke: #9085e9; stroke-dasharray: 5 4; } .w6-vp { stroke: #e34948; } .w6-sig { stroke: #eb6834; } .w6-usb { stroke: #6b6a64; }
  .w6-ctl { stroke: #9085e9; }
  .w6-planw { stroke-dasharray: 7 4; }
  .w6-dot { stroke: none; }
  .w6-dot.w6-gnd { fill: #3d3d3a; } .w6-dot.w6-vp { fill: #e34948; }
  .w6-warn { fill: #d03b3b; font-size: 12px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .w6-bg { fill: #1a1a19; } .w6-box, .w6-plan { fill: #242423; stroke: #898781; } .w6-t, .w6-h { fill: #f0efec; }
    .w6-m { fill: #a3a29b; } .w6-pin { fill: #1a1a19; stroke: #898781; } .w6-gnd { stroke: #b5b4ae; } .w6-dot.w6-gnd { fill: #b5b4ae; }
    .w6-usb { stroke: #a3a29b; }
  }
</style>
<rect class="w6-bg" width="1040" height="610" rx="10"/>

<!-- legend: what is built, what is planned -->
<path class="w6-w w6-usb" d="M690 406 H730"/><text class="w6-m" x="740" y="410">wired and working</text>
<path class="w6-w w6-planw w6-usb" d="M690 428 H730"/><text class="w6-m" x="740" y="432">planned (OLED, added 2026-11-25)</text>

<!-- PC -->
<rect class="w6-box" x="24" y="40" width="130" height="70" rx="6"/>
<text class="w6-h" x="89" y="70" text-anchor="middle">PC</text>
<text class="w6-m" x="89" y="90" text-anchor="middle">simdash</text>
<path class="w6-w w6-usb" d="M154 75 H266"/>
<text class="w6-m" x="210" y="68" text-anchor="middle">USB</text>

<!-- OLED (planned) -->
<rect class="w6-plan" x="24" y="150" width="150" height="200" rx="6"/>
<text class="w6-h" x="99" y="174" text-anchor="middle">2.42″ OLED</text>
<text class="w6-m" x="99" y="190" text-anchor="middle">SSD1309 · 128×64 · SPI</text>
<g class="w6-t">
  <rect class="w6-pin" x="164" y="205" width="10" height="10"/><text x="156" y="214" text-anchor="end">GND</text>
  <rect class="w6-pin" x="164" y="225" width="10" height="10"/><text x="156" y="234" text-anchor="end">VCC</text>
  <rect class="w6-pin" x="164" y="245" width="10" height="10"/><text x="156" y="254" text-anchor="end">SCK (D0)</text>
  <rect class="w6-pin" x="164" y="265" width="10" height="10"/><text x="156" y="274" text-anchor="end">SDA (D1)</text>
  <rect class="w6-pin" x="164" y="285" width="10" height="10"/><text x="156" y="294" text-anchor="end">RES</text>
  <rect class="w6-pin" x="164" y="305" width="10" height="10"/><text x="156" y="314" text-anchor="end">DC</text>
  <rect class="w6-pin" x="164" y="325" width="10" height="10"/><text x="156" y="334" text-anchor="end">CS</text>
</g>
<text class="w6-m" x="99" y="368" text-anchor="middle">planned: race stats while</text>
<text class="w6-m" x="99" y="383" text-anchor="middle">driving (not in the firmware yet)</text>
<text class="w6-m" x="99" y="398" text-anchor="middle">power: pyboard 3V3, not the</text>
<text class="w6-m" x="99" y="413" text-anchor="middle">servo supply (cleaner)</text>
<!-- OLED wires -->
<path class="w6-w w6-planw w6-gnd" d="M174 210 H266"/>
<path class="w6-w w6-planw w6-3v3" d="M174 230 H266"/>
<path class="w6-w w6-planw w6-scl" d="M174 250 H266"/>
<path class="w6-w w6-planw w6-sda" d="M174 270 H266"/>
<path class="w6-w w6-planw w6-ctl" d="M174 290 H266 M174 310 H266 M174 330 H266"/>
<text class="w6-m" x="220" y="202" text-anchor="middle">SPI2</text>

<!-- pyboard -->
<rect class="w6-box" x="266" y="30" width="230" height="330" rx="6"/>
<text class="w6-h" x="381" y="54" text-anchor="middle">pyboard v1.1</text>
<text class="w6-m" x="381" y="72" text-anchor="middle">MicroPython · USB VCP</text>
<text class="w6-m" x="381" y="88" text-anchor="middle">powered by USB only</text>
<g class="w6-t">
  <!-- right side: to the PCA9685 -->
  <rect class="w6-pin" x="486" y="114" width="10" height="10"/><text x="476" y="123" text-anchor="end">GND</text>
  <rect class="w6-pin" x="486" y="144" width="10" height="10"/><text x="476" y="153" text-anchor="end">X8</text>
  <rect class="w6-pin" x="486" y="174" width="10" height="10"/><text x="476" y="183" text-anchor="end">X9 · SCL1</text>
  <rect class="w6-pin" x="486" y="204" width="10" height="10"/><text x="476" y="213" text-anchor="end">X10 · SDA1</text>
  <rect class="w6-pin" x="486" y="234" width="10" height="10"/><text x="476" y="243" text-anchor="end">3V3</text>
  <!-- left side: to the OLED -->
  <rect class="w6-pin" x="266" y="205" width="10" height="10"/><text x="284" y="214">GND</text>
  <rect class="w6-pin" x="266" y="225" width="10" height="10"/><text x="284" y="234">3V3</text>
  <rect class="w6-pin" x="266" y="245" width="10" height="10"/><text x="284" y="254">Y6 · SCK2</text>
  <rect class="w6-pin" x="266" y="265" width="10" height="10"/><text x="284" y="274">Y8 · MOSI2</text>
  <rect class="w6-pin" x="266" y="285" width="10" height="10"/><text x="284" y="294">Y3</text>
  <rect class="w6-pin" x="266" y="305" width="10" height="10"/><text x="284" y="314">Y4</text>
  <rect class="w6-pin" x="266" y="325" width="10" height="10"/><text x="284" y="334">Y5</text>
</g>

<!-- PCA9685 -->
<rect class="w6-box" x="640" y="30" width="200" height="300" rx="6"/>
<text class="w6-h" x="760" y="54" text-anchor="middle">PCA9685</text>
<text class="w6-m" x="760" y="72" text-anchor="middle">16-ch PWM · I2C 0x40 · 50 Hz</text>
<g class="w6-t">
  <rect class="w6-pin" x="640" y="114" width="10" height="10"/><text x="658" y="123">GND</text>
  <rect class="w6-pin" x="640" y="144" width="10" height="10"/><text x="658" y="153">OE</text>
  <rect class="w6-pin" x="640" y="174" width="10" height="10"/><text x="658" y="183">SCL</text>
  <rect class="w6-pin" x="640" y="204" width="10" height="10"/><text x="658" y="213">SDA</text>
  <rect class="w6-pin" x="640" y="234" width="10" height="10"/><text x="658" y="243">VCC (logic)</text>
  <rect class="w6-pin" x="640" y="274" width="10" height="10"/><text x="658" y="283">V+ (servo power)</text>
  <rect class="w6-pin" x="640" y="300" width="10" height="10"/><text x="658" y="309">GND (servo power)</text>
  <text class="w6-m" x="740" y="348" text-anchor="middle">V+ and its GND: the screw terminal</text>
</g>
<!-- logic wires -->
<path class="w6-w w6-gnd" d="M496 119 H640"/>
<path class="w6-w w6-oe" d="M496 149 H640"/>
<path class="w6-w w6-scl" d="M496 179 H640"/>
<path class="w6-w w6-sda" d="M496 209 H640"/>
<path class="w6-w w6-3v3" d="M496 239 H640"/>
<text class="w6-m" x="568" y="141" text-anchor="middle">optional kill</text>

<!-- channels -->
<g class="w6-t">
  <text class="w6-m" x="860" y="44">channel → servo</text>
</g>
<g>
  <rect class="w6-pin" x="830" y="100" width="10" height="10"/>
  <rect class="w6-pin" x="830" y="130" width="10" height="10"/>
  <rect class="w6-pin" x="830" y="160" width="10" height="10"/>
  <rect class="w6-pin" x="830" y="190" width="10" height="10"/>
  <rect class="w6-pin" x="830" y="220" width="10" height="10"/>
  <rect class="w6-pin" x="830" y="250" width="10" height="10"/>
  <text class="w6-t" x="820" y="109" text-anchor="end">0</text><text class="w6-t" x="820" y="139" text-anchor="end">1</text>
  <text class="w6-t" x="820" y="169" text-anchor="end">2</text><text class="w6-t" x="820" y="199" text-anchor="end">3</text>
  <text class="w6-t" x="820" y="229" text-anchor="end">4</text><text class="w6-t" x="820" y="259" text-anchor="end">5</text>
  <path class="w6-w w6-sig" d="M840 105 H910 M840 135 H910 M840 165 H910 M840 195 H910 M840 225 H910 M840 255 H910"/>
</g>
<!-- servos -->
<g>
  <rect class="w6-box" x="910" y="94" width="106" height="22" rx="4"/><text class="w6-t" x="963" y="110" text-anchor="middle">servo 0</text>
  <rect class="w6-box" x="910" y="124" width="106" height="22" rx="4"/><text class="w6-t" x="963" y="140" text-anchor="middle">servo 1</text>
  <rect class="w6-box" x="910" y="154" width="106" height="22" rx="4"/><text class="w6-t" x="963" y="170" text-anchor="middle">servo 2</text>
  <rect class="w6-box" x="910" y="184" width="106" height="22" rx="4"/><text class="w6-t" x="963" y="200" text-anchor="middle">servo 3</text>
  <rect class="w6-box" x="910" y="214" width="106" height="22" rx="4"/><text class="w6-t" x="963" y="230" text-anchor="middle">servo 4</text>
  <rect class="w6-box" x="910" y="244" width="106" height="22" rx="4"/><text class="w6-t" x="963" y="260" text-anchor="middle">servo 5</text>
</g>
<text class="w6-m" x="963" y="290" text-anchor="middle">MG90 × 6, plugs:</text>
<text class="w6-m" x="963" y="306" text-anchor="middle">brown GND · red V+</text>
<text class="w6-m" x="963" y="322" text-anchor="middle">orange signal</text>

<!-- power supply -->
<rect class="w6-box" x="266" y="410" width="170" height="90" rx="6"/>
<text class="w6-h" x="351" y="436" text-anchor="middle">5–6 V supply</text>
<text class="w6-m" x="351" y="454" text-anchor="middle">≥ 5 A (6 × MG90 stall ≈ 4.5 A)</text>
<g class="w6-t">
  <rect class="w6-pin" x="426" y="464" width="10" height="10"/><text x="416" y="473" text-anchor="end">+</text>
  <rect class="w6-pin" x="426" y="484" width="10" height="10"/><text x="416" y="493" text-anchor="end">−</text>
</g>
<path class="w6-w w6-vp" d="M436 469 H590 V279 H640"/>
<path class="w6-w w6-gnd" d="M436 489 H610 V305 H640"/>
<!-- bulk capacitor -->
<path class="w6-w w6-vp" d="M590 469 V500"/><circle class="w6-dot w6-vp" cx="590" cy="469" r="4"/>
<path class="w6-w w6-gnd" d="M610 489 V530 H590 V520"/><circle class="w6-dot w6-gnd" cx="610" cy="489" r="4"/>
<path class="w6-w w6-vp" d="M578 500 H602"/><path class="w6-w w6-gnd" d="M578 520 H602"/>
<text class="w6-m" x="622" y="514">1000 µF ≥ 10 V across V+ / GND (stripe − to GND)</text>

<!-- notes -->
<text class="w6-warn" x="24" y="560">Never feed servo current through the pyboard or USB. Join the grounds (GND ↔ GND ↔ supply −).</text>
<text class="w6-m" x="24" y="580">OE: low = outputs on (pulled low on most breakouts). X8 high cuts all six servos at once. The pyboard's 3V3 feeds only logic: the PCA9685's and the OLED (~20–50 mA).</text>
<text class="w6-m" x="24" y="598">OLED: the 7-pin module as sold for SPI (BS1/BS2 resistors on SPI); SPI2 = Y6 clock, Y8 data, Y5 chip select, Y4 data/command, Y3 reset. X8–X10 stay the PCA9685's.</text>
</svg>
