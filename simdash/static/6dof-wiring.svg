<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="system-ui, sans-serif" font-size="13" role="img" aria-labelledby="w6-title">
<title id="w6-title">Desk 6DOF wiring: PC USB to pyboard v1.1, I2C to a PCA9685, six servos on channels 0 to 5, servo power from a separate 5-6 V supply</title>
<style>
  .w6-bg { fill: #ffffff; }
  .w6-box { fill: #f4f3ef; stroke: #55554f; stroke-width: 1.2; }
  .w6-t { fill: #0b0b0b; }
  .w6-m { fill: #6b6a64; font-size: 11.5px; }
  .w6-h { fill: #0b0b0b; font-weight: 600; font-size: 14px; }
  .w6-pin { fill: #ffffff; stroke: #55554f; }
  .w6-w { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .w6-gnd { stroke: #3d3d3a; } .w6-3v3 { stroke: #2a78d6; } .w6-sda { stroke: #1baf7a; } .w6-scl { stroke: #eda100; }
  .w6-oe { stroke: #9085e9; stroke-dasharray: 5 4; } .w6-vp { stroke: #e34948; } .w6-sig { stroke: #eb6834; } .w6-usb { stroke: #6b6a64; }
  .w6-dot { stroke: none; }
  .w6-dot.w6-gnd { fill: #3d3d3a; } .w6-dot.w6-vp { fill: #e34948; }
  .w6-warn { fill: #d03b3b; font-size: 12px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .w6-bg { fill: #1a1a19; } .w6-box { fill: #242423; stroke: #898781; } .w6-t, .w6-h { fill: #f0efec; }
    .w6-m { fill: #a3a29b; } .w6-pin { fill: #1a1a19; stroke: #898781; } .w6-gnd { stroke: #b5b4ae; } .w6-dot.w6-gnd { fill: #b5b4ae; }
    .w6-usb { stroke: #a3a29b; }
  }
</style>
<rect class="w6-bg" width="920" height="560" rx="10"/>

<!-- PC -->
<rect class="w6-box" x="24" y="40" width="120" height="70" rx="6"/>
<text class="w6-h" x="84" y="70" text-anchor="middle">PC</text>
<text class="w6-m" x="84" y="90" text-anchor="middle">simdash</text>
<path class="w6-w w6-usb" d="M144 75 H206"/>
<text class="w6-m" x="175" y="68" text-anchor="middle">USB</text>

<!-- pyboard -->
<rect class="w6-box" x="206" y="30" width="170" height="230" rx="6"/>
<text class="w6-h" x="291" y="54" text-anchor="middle">pyboard v1.1</text>
<text class="w6-m" x="291" y="72" text-anchor="middle">MicroPython · USB VCP</text>
<text class="w6-m" x="291" y="88" text-anchor="middle">powered by USB only</text>
<g class="w6-t">
  <rect class="w6-pin" x="366" y="114" width="10" height="10"/><text x="356" y="123" text-anchor="end">GND</text>
  <rect class="w6-pin" x="366" y="144" width="10" height="10"/><text x="356" y="153" text-anchor="end">X8</text>
  <rect class="w6-pin" x="366" y="174" width="10" height="10"/><text x="356" y="183" text-anchor="end">X9 · SCL1</text>
  <rect class="w6-pin" x="366" y="204" width="10" height="10"/><text x="356" y="213" text-anchor="end">X10 · SDA1</text>
  <rect class="w6-pin" x="366" y="234" width="10" height="10"/><text x="356" y="243" text-anchor="end">3V3</text>
</g>

<!-- PCA9685 -->
<rect class="w6-box" x="520" y="30" width="200" height="300" rx="6"/>
<text class="w6-h" x="640" y="54" text-anchor="middle">PCA9685</text>
<text class="w6-m" x="640" y="72" text-anchor="middle">16-ch PWM · I2C 0x40 · 50 Hz</text>
<g class="w6-t">
  <rect class="w6-pin" x="520" y="114" width="10" height="10"/><text x="538" y="123">GND</text>
  <rect class="w6-pin" x="520" y="144" width="10" height="10"/><text x="538" y="153">OE</text>
  <rect class="w6-pin" x="520" y="174" width="10" height="10"/><text x="538" y="183">SCL</text>
  <rect class="w6-pin" x="520" y="204" width="10" height="10"/><text x="538" y="213">SDA</text>
  <rect class="w6-pin" x="520" y="234" width="10" height="10"/><text x="538" y="243">VCC (logic)</text>
  <rect class="w6-pin" x="520" y="274" width="10" height="10"/><text x="538" y="283">V+ (servo power)</text>
  <rect class="w6-pin" x="520" y="300" width="10" height="10"/><text x="538" y="309">GND (servo power)</text>
  <text class="w6-m" x="620" y="348" text-anchor="middle">V+ and its GND: the screw terminal</text>
</g>
<!-- logic wires -->
<path class="w6-w w6-gnd" d="M376 119 H520"/>
<path class="w6-w w6-oe" d="M376 149 H520"/>
<path class="w6-w w6-scl" d="M376 179 H520"/>
<path class="w6-w w6-sda" d="M376 209 H520"/>
<path class="w6-w w6-3v3" d="M376 239 H520"/>
<text class="w6-m" x="448" y="141" text-anchor="middle">optional kill</text>

<!-- channels -->
<g class="w6-t">
  <text class="w6-m" x="740" y="44">channel → servo</text>
</g>
<g>
  <rect class="w6-pin" x="710" y="100" width="10" height="10"/>
  <rect class="w6-pin" x="710" y="130" width="10" height="10"/>
  <rect class="w6-pin" x="710" y="160" width="10" height="10"/>
  <rect class="w6-pin" x="710" y="190" width="10" height="10"/>
  <rect class="w6-pin" x="710" y="220" width="10" height="10"/>
  <rect class="w6-pin" x="710" y="250" width="10" height="10"/>
  <text class="w6-t" x="700" y="109" text-anchor="end">0</text><text class="w6-t" x="700" y="139" text-anchor="end">1</text>
  <text class="w6-t" x="700" y="169" text-anchor="end">2</text><text class="w6-t" x="700" y="199" text-anchor="end">3</text>
  <text class="w6-t" x="700" y="229" text-anchor="end">4</text><text class="w6-t" x="700" y="259" text-anchor="end">5</text>
  <path class="w6-w w6-sig" d="M720 105 H790 M720 135 H790 M720 165 H790 M720 195 H790 M720 225 H790 M720 255 H790"/>
</g>
<!-- servos -->
<g>
  <rect class="w6-box" x="790" y="94" width="106" height="22" rx="4"/><text class="w6-t" x="843" y="110" text-anchor="middle">servo 0</text>
  <rect class="w6-box" x="790" y="124" width="106" height="22" rx="4"/><text class="w6-t" x="843" y="140" text-anchor="middle">servo 1</text>
  <rect class="w6-box" x="790" y="154" width="106" height="22" rx="4"/><text class="w6-t" x="843" y="170" text-anchor="middle">servo 2</text>
  <rect class="w6-box" x="790" y="184" width="106" height="22" rx="4"/><text class="w6-t" x="843" y="200" text-anchor="middle">servo 3</text>
  <rect class="w6-box" x="790" y="214" width="106" height="22" rx="4"/><text class="w6-t" x="843" y="230" text-anchor="middle">servo 4</text>
  <rect class="w6-box" x="790" y="244" width="106" height="22" rx="4"/><text class="w6-t" x="843" y="260" text-anchor="middle">servo 5</text>
</g>
<text class="w6-m" x="843" y="290" text-anchor="middle">MG90 × 6, plugs:</text>
<text class="w6-m" x="843" y="306" text-anchor="middle">brown GND · red V+</text>
<text class="w6-m" x="843" y="322" text-anchor="middle">orange signal</text>

<!-- power supply -->
<rect class="w6-box" x="206" y="380" width="170" height="90" rx="6"/>
<text class="w6-h" x="291" y="406" text-anchor="middle">5–6 V supply</text>
<text class="w6-m" x="291" y="424" text-anchor="middle">≥ 5 A (6 × MG90 stall ≈ 4.5 A)</text>
<g class="w6-t">
  <rect class="w6-pin" x="366" y="434" width="10" height="10"/><text x="356" y="443" text-anchor="end">+</text>
  <rect class="w6-pin" x="366" y="454" width="10" height="10"/><text x="356" y="463" text-anchor="end">−</text>
</g>
<path class="w6-w w6-vp" d="M376 439 H470 V279 H520"/>
<path class="w6-w w6-gnd" d="M376 459 H490 V305 H520"/>
<!-- bulk capacitor -->
<path class="w6-w w6-vp" d="M470 439 V470"/><circle class="w6-dot w6-vp" cx="470" cy="439" r="4"/>
<path class="w6-w w6-gnd" d="M490 459 V500 H470 V490"/><circle class="w6-dot w6-gnd" cx="490" cy="459" r="4"/>
<path class="w6-w w6-vp" d="M458 470 H482"/><path class="w6-w w6-gnd" d="M458 490 H482"/>
<text class="w6-m" x="500" y="484">1000 µF ≥ 10 V across V+ / GND</text>

<!-- notes -->
<text class="w6-warn" x="24" y="520">Never feed servo current through the pyboard or USB. Join the grounds (GND ↔ GND ↔ supply −).</text>
<text class="w6-m" x="24" y="542">OE: low = outputs on (pulled low on most breakouts). X8 high cuts all six servos at once. The 3V3 pin feeds the PCA9685 logic only.</text>
</svg>
